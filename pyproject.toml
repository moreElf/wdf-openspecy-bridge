[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wdf-openspecy-bridge"
version = "0.1.0"
description = "Convert Renishaw .wdf Raman spectra to OpenSpecy-compatible CSV (optional OpenSpecy R matching)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["renishaw-wdf>=1.4.0", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
app = ["pyinstaller>=6"]

[project.scripts]
wdf2csv = "wdf_openspecy_bridge.cli:main"

[project.gui-scripts]
wdf2csv-gui = "wdf_openspecy_bridge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wdf_openspecy_bridge = ["*.R"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src"]
